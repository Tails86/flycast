name: Xbox, UWP

on:
  push:
    branches-ignore:
      - 'l10n_**'
  pull_request:

jobs:
  build:
    name: UWP
    runs-on: windows-2022

    strategy:
      matrix:
        arch: [ Win32, x64, ARM64 ]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A ${{ matrix.arch }} -DCMAKE_SYSTEM_NAME=WindowsStore -DCMAKE_SYSTEM_VERSION=10.0.22000.0
          cmake --build build --config Release -- /m
        shell: cmd

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Package app
        run: |
          mkdir build\artifact
          cd build\AppPackages\Hollycast\Hollycast_*_Test
          mkdir tmp
          ren *.msix Hollycast.msix
          makeappx unpack /p .\Hollycast.msix /d tmp
          copy ..\..\..\Release\*.dll tmp
          makeappx pack /d tmp /p ..\..\..\artifact\Hollycast.appx

      # Package signing and upload steps have been removed until a proper signing certificate is obtained
